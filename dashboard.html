<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월별 카테고리 성과 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .metric-card.sales {
            border-left-color: #667eea;
        }

        .metric-card.orders {
            border-left-color: #764ba2;
        }

        .metric-card.users {
            border-left-color: #f093fb;
        }

        .metric-card.growth {
            border-left-color: #4facfe;
        }

        .metric-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .metric-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .metric-change {
            font-size: 12px;
            color: #27ae60;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .table-title {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f5f5f5;
            color: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #666;
        }

        tr:hover {
            background: #fafafa;
        }

        .category-name {
            font-weight: 600;
            color: #333;
        }

        .positive {
            color: #27ae60;
        }

        .negative {
            color: #e74c3c;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            background: white;
            color: #333;
        }

        select:hover {
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 월별 카테고리 성과 대시보드</h1>
            <p>2026년 3월 ~ 5월 판매 현황 및 성과 분석</p>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <span class="filter-label">카테고리 선택:</span>
                <select id="categoryFilter">
                    <option value="all">전체 카테고리</option>
                    <option value="ìë¥">ìë¥</option>
                    <option value="ê°êµ¬">ê°êµ¬</option>
                    <option value="ìíì©í">ìíì©í</option>
                    <option value="ì ìì í">ì ìì í</option>
                    <option value="ë·°í°">ë·°í°</option>
                </select>
            </div>
        </div>

        <div class="metrics-grid" id="metricsGrid">
            <!-- 동적으로 생성됨 -->
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">월별 총매출 추이</div>
                <div class="chart-wrapper">
                    <canvas id="salesTrendChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">카테고리별 매출 비교 (2026년 5월)</div>
                <div class="chart-wrapper">
                    <canvas id="categorySalesChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">월별 주문 건수</div>
                <div class="chart-wrapper">
                    <canvas id="ordersChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">활성 사용자 수 추이</div>
                <div class="chart-wrapper">
                    <canvas id="usersChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">월별 성장률</div>
                <div class="chart-wrapper">
                    <canvas id="growthChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">반품률 분석</div>
                <div class="chart-wrapper">
                    <canvas id="returnRateChart"></canvas>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-title">상세 데이터</div>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>월</th>
                        <th>카테고리</th>
                        <th>총매출</th>
                        <th>주문 건수</th>
                        <th>활성 사용자</th>
                        <th>평균 주문액</th>
                        <th>성장률</th>
                        <th>반품률</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 동적으로 생성됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 데이터 정의
        const data = [
            {month: '2026-03', category: 'ìë¥', sales: 28500000, orders: 890, users: 2800, avgOrderValue: 32022, growth: 0.12, returnRate: 0.055},
            {month: '2026-03', category: 'ê°êµ¬', sales: 31200000, orders: 750, users: 2100, avgOrderValue: 41600, growth: 0.08, returnRate: 0.042},
            {month: '2026-03', category: 'ìíì©í', sales: 14850000, orders: 2100, users: 3200, avgOrderValue: 7071, growth: 0.15, returnRate: 0.065},
            {month: '2026-03', category: 'ì ìì í', sales: 47300000, orders: 920, users: 2500, avgOrderValue: 51413, growth: 0.10, returnRate: 0.048},
            {month: '2026-03', category: 'ë·°í°', sales: 23400000, orders: 1650, users: 2900, avgOrderValue: 14182, growth: 0.18, returnRate: 0.052},
            {month: '2026-04', category: 'ìë¥', sales: 31200000, orders: 980, users: 3100, avgOrderValue: 31837, growth: 0.09, returnRate: 0.058},
            {month: '2026-04', category: 'ê°êµ¬', sales: 33800000, orders: 820, users: 2300, avgOrderValue: 41220, growth: 0.08, returnRate: 0.048},
            {month: '2026-04', category: 'ìíì©í', sales: 16200000, orders: 2350, users: 3500, avgOrderValue: 6894, growth: 0.09, returnRate: 0.068},
            {month: '2026-04', category: 'ì ìì í', sales: 51800000, orders: 1020, users: 2800, avgOrderValue: 50784, growth: 0.09, returnRate: 0.051},
            {month: '2026-04', category: 'ë·°í°', sales: 25600000, orders: 1800, users: 3200, avgOrderValue: 14222, growth: 0.09, returnRate: 0.056},
            {month: '2026-05', category: 'ìë¥', sales: 24120000, orders: 760, users: 2450, avgOrderValue: 31737, growth: 0.23, returnRate: 0.053},
            {month: '2026-05', category: 'ê°êµ¬', sales: 26080000, orders: 634, users: 1596, avgOrderValue: 41139, growth: 0.23, returnRate: 0.045},
            {month: '2026-05', category: 'ìíì©í', sales: 12540000, orders: 1817, users: 2757, avgOrderValue: 6903, growth: 0.23, returnRate: 0.064},
            {month: '2026-05', category: 'ì ìì í', sales: 39410000, orders: 788, users: 2159, avgOrderValue: 50012, growth: 0.24, returnRate: 0.049},
            {month: '2026-05', category: 'ë·°í°', sales: 19850000, orders: 1395, users: 2487, avgOrderValue: 14227, growth: 0.23, returnRate: 0.054}
        ];

        let filteredData = data;
        let charts = {};

        // 포맷 함수들
        function formatCurrency(value) {
            return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW', maximumFractionDigits: 0 }).format(value);
        }

        function formatPercent(value) {
            return (value * 100).toFixed(2) + '%';
        }

        function formatNumber(value) {
            return new Intl.NumberFormat('ko-KR').format(value);
        }

        // 필터 처리
        document.getElementById('categoryFilter').addEventListener('change', function(e) {
            const selectedCategory = e.target.value;
            if (selectedCategory === 'all') {
                filteredData = data;
            } else {
                filteredData = data.filter(row => row.category === selectedCategory);
            }
            updateDashboard();
        });

        // 대시보드 업데이트
        function updateDashboard() {
            updateMetrics();
            updateCharts();
            updateTable();
        }

        // 메트릭 카드 업데이트
        function updateMetrics() {
            const latestMonth = filteredData.filter(d => d.month === '2026-05');
            const previousMonth = filteredData.filter(d => d.month === '2026-04');

            const totalSales = latestMonth.reduce((sum, d) => sum + d.sales, 0);
            const totalOrders = latestMonth.reduce((sum, d) => sum + d.orders, 0);
            const totalUsers = latestMonth.reduce((sum, d) => sum + d.users, 0);
            const avgGrowth = latestMonth.reduce((sum, d) => sum + d.growth, 0) / latestMonth.length;

            const prevSales = previousMonth.reduce((sum, d) => sum + d.sales, 0);
            const salesChange = ((totalSales - prevSales) / prevSales * 100).toFixed(1);

            const metricsHTML = `
                <div class="metric-card sales">
                    <div class="metric-label">총 매출 (5월)</div>
                    <div class="metric-value">${formatCurrency(totalSales)}</div>
                    <div class="metric-change ${salesChange >= 0 ? 'positive' : 'negative'}">
                        ${salesChange >= 0 ? '📈' : '📉'} ${salesChange}% (4월 대비)
                    </div>
                </div>
                <div class="metric-card orders">
                    <div class="metric-label">총 주문 건수 (5월)</div>
                    <div class="metric-value">${formatNumber(totalOrders)}</div>
                    <div class="metric-change">건</div>
                </div>
                <div class="metric-card users">
                    <div class="metric-label">활성 사용자 (5월)</div>
                    <div class="metric-value">${formatNumber(totalUsers)}</div>
                    <div class="metric-change">명</div>
                </div>
                <div class="metric-card growth">
                    <div class="metric-label">평균 성장률 (5월)</div>
                    <div class="metric-value">${formatPercent(avgGrowth)}</div>
                    <div class="metric-change">📊 카테고리 평균</div>
                </div>
            `;
            document.getElementById('metricsGrid').innerHTML = metricsHTML;
        }

        // 차트 업데이트
        function updateCharts() {
            // 월별 매출 추이
            const monthlyData = {};
            filteredData.forEach(d => {
                if (!monthlyData[d.month]) {
                    monthlyData[d.month] = 0;
                }
                monthlyData[d.month] += d.sales;
            });

            const months = Object.keys(monthlyData).sort();
            const salesValues = months.map(m => monthlyData[m] / 1000000);

            if (charts.salesTrendChart) charts.salesTrendChart.destroy();
            charts.salesTrendChart = new Chart(document.getElementById('salesTrendChart'), {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: '총 매출 (백만원)',
                        data: salesValues,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } }
                }
            });

            // 카테고리별 매출 (5월)
            const mayData = filteredData.filter(d => d.month === '2026-05');
            if (charts.categorySalesChart) charts.categorySalesChart.destroy();
            charts.categorySalesChart = new Chart(document.getElementById('categorySalesChart'), {
                type: 'bar',
                data: {
                    labels: mayData.map(d => d.category),
                    datasets: [{
                        label: '매출 (백만원)',
                        data: mayData.map(d => d.sales / 1000000),
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // 월별 주문 건수
            const monthlyOrders = {};
            filteredData.forEach(d => {
                if (!monthlyOrders[d.month]) {
                    monthlyOrders[d.month] = 0;
                }
                monthlyOrders[d.month] += d.orders;
            });

            const orderMonths = Object.keys(monthlyOrders).sort();
            const orderValues = orderMonths.map(m => monthlyOrders[m]);

            if (charts.ordersChart) charts.ordersChart.destroy();
            charts.ordersChart = new Chart(document.getElementById('ordersChart'), {
                type: 'bar',
                data: {
                    labels: orderMonths,
                    datasets: [{
                        label: '주문 건수',
                        data: orderValues,
                        backgroundColor: '#764ba2'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // 활성 사용자 수
            const monthlyUsers = {};
            filteredData.forEach(d => {
                if (!monthlyUsers[d.month]) {
                    monthlyUsers[d.month] = 0;
                }
                monthlyUsers[d.month] += d.users;
            });

            const userMonths = Object.keys(monthlyUsers).sort();
            const userValues = userMonths.map(m => monthlyUsers[m]);

            if (charts.usersChart) charts.usersChart.destroy();
            charts.usersChart = new Chart(document.getElementById('usersChart'), {
                type: 'line',
                data: {
                    labels: userMonths,
                    datasets: [{
                        label: '활성 사용자',
                        data: userValues,
                        borderColor: '#f093fb',
                        backgroundColor: 'rgba(240, 147, 251, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: '#f093fb'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // 성장률
            const monthlyGrowth = {};
            const monthlyGrowthCount = {};
            filteredData.forEach(d => {
                if (!monthlyGrowth[d.month]) {
                    monthlyGrowth[d.month] = 0;
                    monthlyGrowthCount[d.month] = 0;
                }
                monthlyGrowth[d.month] += d.growth;
                monthlyGrowthCount[d.month]++;
            });

            const growthMonths = Object.keys(monthlyGrowth).sort();
            const growthValues = growthMonths.map(m => (monthlyGrowth[m] / monthlyGrowthCount[m] * 100).toFixed(2));

            if (charts.growthChart) charts.growthChart.destroy();
            charts.growthChart = new Chart(document.getElementById('growthChart'), {
                type: 'bar',
                data: {
                    labels: growthMonths,
                    datasets: [{
                        label: '평균 성장률 (%)',
                        data: growthValues,
                        backgroundColor: '#4facfe'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // 반품률
            const mayReturnData = filteredData.filter(d => d.month === '2026-05');
            if (charts.returnRateChart) charts.returnRateChart.destroy();
            charts.returnRateChart = new Chart(document.getElementById('returnRateChart'), {
                type: 'bar',
                data: {
                    labels: mayReturnData.map(d => d.category),
                    datasets: [{
                        label: '반품률 (%)',
                        data: mayReturnData.map(d => (d.returnRate * 100).toFixed(2)),
                        backgroundColor: '#e74c3c'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        // 테이블 업데이트
        function updateTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            filteredData.sort((a, b) => {
                if (a.month !== b.month) return a.month.localeCompare(b.month);
                return a.category.localeCompare(b.category);
            }).forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.month}</td>
                    <td class="category-name">${row.category}</td>
                    <td>${formatCurrency(row.sales)}</td>
                    <td>${formatNumber(row.orders)}</td>
                    <td>${formatNumber(row.users)}</td>
                    <td>${formatCurrency(row.avgOrderValue)}</td>
                    <td class="positive">${formatPercent(row.growth)}</td>
                    <td>${formatPercent(row.returnRate)}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 초기 로드
        window.addEventListener('DOMContentLoaded', updateDashboard);
    </script>
</body>
</html>
